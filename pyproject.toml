[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "refinery-watch"
version = "0.1.0"
description = "Refinery outage tracker."
requires-python = ">=3.12,<3.13"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[tool.uv]
required-version = ">=0.13.7"

[tool.hatch.build.targets.wheel]
packages = ["src/refinery_watch"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["refinery_watch"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
