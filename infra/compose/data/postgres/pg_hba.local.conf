# Laptop only. The Docker Desktop bridge hides the client address, so the
# source is not filtered here. On the Linux Droplet, iptables DNAT keeps it.
# The port is bound to 127.0.0.1. The superuser cannot log in over the network.
local  all  postgres              peer
local  all  all                   scram-sha-256
host   all  postgres  0.0.0.0/0   reject
host   all  postgres  ::/0        reject
host   all  all       0.0.0.0/0   scram-sha-256
host   all  all       ::/0        scram-sha-256
