# Laptop only. Published ports reach the container through the Docker bridge,
# so the source address is not filtered here. The port is bound to 127.0.0.1.
# The superuser cannot log in over the network.
local  all  postgres              peer
local  all  all                   scram-sha-256
host   all  postgres  0.0.0.0/0   reject
host   all  postgres  ::/0        reject
host   all  all       0.0.0.0/0   scram-sha-256
host   all  all       ::/0        scram-sha-256
