# The superuser cannot log in over the network. Source addresses are not
# filtered here: published ports hide the client address. The cloud firewall
# and the bind address restrict who can connect.
local  all  postgres              peer
local  all  all                   scram-sha-256
host   all  postgres  0.0.0.0/0   reject
host   all  postgres  ::/0        reject
host   all  all       0.0.0.0/0   scram-sha-256
host   all  all       ::/0        scram-sha-256
