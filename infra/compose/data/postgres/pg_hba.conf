# Network access is limited to the VPC range, the same value as vpc_ip_range
# in infra/terraform/variables.tf. On the Linux Droplet, iptables DNAT keeps
# the client source address, so this filter sees the real caller. Docker
# Desktop hides it on the laptop, see pg_hba.local.conf. The superuser and the
# laptop test roles are rejected on every address before the allow rule.
local  all  postgres                                peer
local  all  all                                     scram-sha-256
host   all  postgres                  0.0.0.0/0     reject
host   all  postgres                  ::/0          reject
host   all  refinery_test_owner,refinery_test_app  0.0.0.0/0  reject
host   all  refinery_test_owner,refinery_test_app  ::/0       reject
host   all  all                       10.110.0.0/24 scram-sha-256
host   all  all                       0.0.0.0/0     reject
host   all  all                       ::/0          reject
